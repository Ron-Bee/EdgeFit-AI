plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.edgefit.diag'
    compileSdk 35
    ndkVersion '28.0.13004108'

    defaultConfig {
        applicationId 'ai.edgefit.diag'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Release signing is owner-supplied off-repo (never committed).
    // When ~/.gradle/gradle.properties defines releaseKeystoreFile,
    // releaseKeystorePassword, releaseKeyAlias and releaseKeyPassword,
    // the publicPreview build signs with it; otherwise the build
    // produces an unsigned APK for gate inspection only.
    signingConfigs {
        preview {
            def propsFile = new File(
                System.getProperty('user.home') +
                '/.gradle/gradle.properties')
            def props = new Properties()
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def ks = props.getProperty('releaseKeystoreFile')
            if (ks != null) {
                storeFile = new File(ks)
                storePassword = props.getProperty(
                    'releaseKeystorePassword')
                keyAlias = props.getProperty('releaseKeyAlias')
                keyPassword = props.getProperty('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            // EF-BENCH-STALL-03: debug builds use the same -O3 native flags
            // as the benchmark variant. The unoptimized (-O0) native lib
            // made prefill 20-100x slower (941ms -> 45s+), presenting as a
            // stall after the .bench package was removed on Nov 1.
            // Debuggable install preserved.
            buildConfigField "String", "NATIVE_OPT", '"-O3 -g"'
            externalNativeBuild {
                cmake {
                    cFlags '-O3 -g'
                    cppFlags '-O3 -g'
                }
            }
        }
        release {
            minifyEnabled false
            buildConfigField "String", "NATIVE_OPT", '"toolchain default"'
        }
        // Public-preview release: non-debuggable, stable applicationId,
        // -O3 native (same flags as the verified debug/benchmark builds;
        // unoptimized native presented as a prefill stall). Signed only
        // when the owner keystore props exist; otherwise unsigned.
        publicPreview {
            initWith release
            debuggable false
            jniDebuggable false
            minifyEnabled false
            buildConfigField "String", "NATIVE_OPT", '"-O3 -g"'
            externalNativeBuild {
                cmake {
                    cFlags '-O3 -g'
                    cppFlags '-O3 -g'
                }
            }
        }
        // Optimized benchmark variant: debuggable install with -O3 native
        // code (llama.cpp, ggml, JNI). Portable arm64 only, no -march.
        benchmark {
            initWith debug
            applicationIdSuffix '.bench'
            debuggable true
            jniDebuggable true
            minifyEnabled false
            buildConfigField "String", "NATIVE_OPT", '"-O3 -g"'
            externalNativeBuild {
                cmake {
                    cFlags '-O3 -g'
                    cppFlags '-O3 -g'
                }
            }
        }
    }
    afterEvaluate {
        // Owner key present -> sign; otherwise leave unsigned for
        // gate inspection (never silently debug-signed).
        if (signingConfigs.preview.storeFile != null) {
            buildTypes.publicPreview.signingConfig =
                signingConfigs.preview
        }
    }
    applicationVariants.configureEach {
        if (buildType.name == 'publicPreview') {
            outputs.configureEach {
                versionCodeOverride = 3
                versionNameOverride = '0.2.1-preview.1'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Zero runtime dependencies. JUnit only for local unit tests.
    testImplementation 'junit:junit:4.13.2'
}
