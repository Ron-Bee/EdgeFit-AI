plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ai.edgefit.diag'
    compileSdk 35
    ndkVersion '28.0.13004108'

    defaultConfig {
        applicationId 'ai.edgefit.diag'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField "String", "NATIVE_OPT", '"toolchain default (unoptimized)"'
        }
        release {
            minifyEnabled false
            buildConfigField "String", "NATIVE_OPT", '"toolchain default"'
        }
        // Optimized benchmark variant: debuggable install with -O3 native
        // code (llama.cpp, ggml, JNI). Portable arm64 only, no -march.
        benchmark {
            initWith debug
            applicationIdSuffix '.bench'
            debuggable true
            jniDebuggable true
            minifyEnabled false
            buildConfigField "String", "NATIVE_OPT", '"-O3 -g"'
            externalNativeBuild {
                cmake {
                    cFlags '-O3 -g'
                    cppFlags '-O3 -g'
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Zero runtime dependencies. JUnit only for local unit tests.
    testImplementation 'junit:junit:4.13.2'
}
