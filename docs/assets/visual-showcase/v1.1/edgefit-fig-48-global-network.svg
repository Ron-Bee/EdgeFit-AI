<line x1="636" y1="445" x2="620" y2="445" marker-end="url(#aB48)"/>
<line x1="336" y1="445" x2="320" y2="445" marker-end="url(#aB48)"/>
</g>
<rect x="40" y="570" width="740" height="150" rx="14" fill="#2A1626" stroke="#E5484D" stroke-width="3"/>
<text x="410" y="615" font-size="24" font-weight="700" fill="#E5484D" text-anchor="middle">RECEIPT ≠ QUALIFIED ≠ PUBLISHED</text>
<text x="410" y="650" font-size="19" fill="#F3F7FE" text-anchor="middle">A 201 + submission ID proves intake only.</text>
<text x="410" y="682" font-size="19" fill="#9DB2D6" text-anchor="middle">Publication needs quorum AND gate B.</text>
<rect x="820" y="570" width="740" height="150" rx="14" fill="#0E2140" stroke="#F5A623" stroke-width="2.5"/>
<text x="1190" y="615" font-size="22" font-weight="700" fill="#F5A623" text-anchor="middle">Withdrawal → tombstone</text>
<text x="1190" y="650" font-size="19" fill="#F3F7FE" text-anchor="middle">Owner DELETE revokes the contribution;</text>
<text x="1190" y="682" font-size="19" fill="#9DB2D6" text-anchor="middle">a minimal audit tombstone remains.</text>
<text x="60" y="780" font-size="19" fill="#9DB2D6">Sources: bridge contract v1.1 · ef-consent-01 (A approved, B OFF) · Global P0 receipt · G2-B2 staging reports · ss-33/34/35/36</text>
<rect x="40" y="810" width="1520" height="3" fill="#2A4A7A"/>
<text x="60" y="850" font-size="20" fill="#F3F7FE">Status honesty: SUBMITTED / VALIDATED / QUALIFIED / PUBLISHED / REVOKED are distinct — the dashboard shows each count separately.</text>
<text x="60" y="890" font-size="18" fill="#9DB2D6">Snapshot (staging census, Nov 2026): 31 accepted · 3 installs · 31 qualified · 0 published — quorum unmet, gate B OFF.</text>
