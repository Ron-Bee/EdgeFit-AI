<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000">
<style>html,body{margin:0;padding:0}text{font-family:'Segoe UI',Verdana,sans-serif}</style>
<defs><marker id="aB26" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#49BBFF"/></marker></defs>
<rect width="1600" height="1000" fill="#0A1830"/>
<text x="60" y="80" font-size="42" font-weight="700" fill="#F3F7FE">Native Benchmark Pipeline</text>
<text x="60" y="118" font-size="20" fill="#9DB2D6">BenchRunner: preflight → one worker thread → watchdog → exactly one BenchResult per run (FIG 26)</text>
<rect x="40" y="300" width="150" height="80" rx="40" fill="#0E2140" stroke="#9DB2D6" stroke-width="3"/>
<text x="115" y="350" font-size="24" font-weight="700" fill="#F3F7FE" text-anchor="middle">IDLE</text>
<polygon points="340,285 470,340 340,395 210,340" fill="#0E2140" stroke="#F5A623" stroke-width="3"/>
<text x="340" y="332" font-size="20" font-weight="600" fill="#F3F7FE" text-anchor="middle">preflight</text>
<text x="340" y="360" font-size="20" font-weight="600" fill="#F3F7FE" text-anchor="middle">guards?</text>
<line x1="190" y1="340" x2="206" y2="340" stroke="#49BBFF" stroke-width="3" marker-end="url(#aB26)"/>
<rect x="560" y="180" width="500" height="330" rx="20" fill="#0E2140" stroke="#1265F5" stroke-width="3"/>
<text x="580" y="225" font-size="24" font-weight="700" fill="#49BBFF">RUNNING — worker thread</text>
<rect x="585" y="250" width="200" height="90" rx="12" fill="#12294D" stroke="#1265F5" stroke-width="2"/>
<text x="685" y="286" font-size="20" font-weight="600" fill="#F3F7FE" text-anchor="middle">load</text>
<text x="685" y="314" font-size="16" fill="#9DB2D6" text-anchor="middle">model → RAM</text>
<rect x="810" y="250" width="200" height="90" rx="12" fill="#12294D" stroke="#1265F5" stroke-width="2"/>
<text x="910" y="286" font-size="20" font-weight="600" fill="#F3F7FE" text-anchor="middle">prefill</text>
<text x="910" y="314" font-size="16" fill="#9DB2D6" text-anchor="middle">prompt tokens</text>
<rect x="585" y="360" width="200" height="90" rx="12" fill="#12294D" stroke="#1265F5" stroke-width="2"/>
<text x="685" y="396" font-size="20" font-weight="600" fill="#F3F7FE" text-anchor="middle">generate</text>
<text x="685" y="424" font-size="16" fill="#9DB2D6" text-anchor="middle">timed tokens</text>
<rect x="810" y="360" width="200" height="90" rx="12" fill="#12294D" stroke="#49BBFF" stroke-width="2"/>
<text x="910" y="396" font-size="20" font-weight="600" fill="#F3F7FE" text-anchor="middle">assemble</text>
<text x="910" y="424" font-size="16" fill="#9DB2D6" text-anchor="middle">result + hashes</text>
<g stroke="#49BBFF" stroke-width="2.5">
<line x1="785" y1="295" x2="806" y2="295" marker-end="url(#aB26)"/>
<line x1="910" y1="340" x2="910" y2="356" marker-end="url(#aB26)"/>
<line x1="806" y1="405" x2="789" y2="405" marker-end="url(#aB26)"/>
</g>
<text x="585" y="485" font-size="17" fill="#9DB2D6">cooperative cancel checked between stages</text>
<line x1="470" y1="340" x2="556" y2="340" stroke="#34C77B" stroke-width="3" marker-end="url(#aB26)"/>
<text x="513" y="325" font-size="17" fill="#34C77B" text-anchor="middle">go</text>
<!-- refusal -->
<rect x="180" y="450" width="320" height="90" rx="12" fill="#12294D" stroke="#E5484D" stroke-width="2.5"/>
<text x="340" y="486" font-size="20" font-weight="600" fill="#E5484D" text-anchor="middle">REFUSED — reasons listed</text>
<text x="340" y="514" font-size="17" fill="#9DB2D6" text-anchor="middle">stays IDLE · no result fabricated</text>
<line x1="340" y1="395" x2="340" y2="446" stroke="#E5484D" stroke-width="2.5" marker-end="url(#aB26)"/>
<!-- watchdog -->
<rect x="560" y="560" width="500" height="100" rx="12" fill="#0E2140" stroke="#F5A623" stroke-width="2.5"/>
<text x="810" y="598" font-size="20" font-weight="600" fill="#F5A623" text-anchor="middle">watchdog timer</text>
<text x="810" y="628" font-size="17" fill="#9DB2D6" text-anchor="middle">overrun → TIMEOUT outcome, worker stopped</text>
<line x1="810" y1="510" x2="810" y2="556" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aB26)"/>
<!-- outcomes -->
<text x="1120" y="200" font-size="22" font-weight="700" fill="#F3F7FE">Terminal outcomes (distinct)</text>
<rect x="1120" y="220" width="420" height="80" rx="12" fill="#12294D" stroke="#34C77B" stroke-width="2.5"/>
<text x="1330" y="254" font-size="21" font-weight="600" fill="#34C77B" text-anchor="middle">COMPLETED</text>
<text x="1330" y="282" font-size="17" fill="#9DB2D6" text-anchor="middle">measured tok/s saved</text>
<rect x="1120" y="315" width="420" height="80" rx="12" fill="#12294D" stroke="#F5A623" stroke-width="2.5"/>
<text x="1330" y="349" font-size="21" font-weight="600" fill="#F5A623" text-anchor="middle">CANCELLED</text>
<text x="1330" y="377" font-size="17" fill="#9DB2D6" text-anchor="middle">owner stopped · labeled outcome</text>
<rect x="1120" y="410" width="420" height="80" rx="12" fill="#12294D" stroke="#E5484D" stroke-width="2.5"/>
<text x="1330" y="444" font-size="21" font-weight="600" fill="#E5484D" text-anchor="middle">FAILED</text>
<text x="1330" y="472" font-size="17" fill="#9DB2D6" text-anchor="middle">error recorded, labeled</text>
<rect x="1120" y="505" width="420" height="80" rx="12" fill="#12294D" stroke="#E5484D" stroke-width="2.5"/>
<text x="1330" y="539" font-size="21" font-weight="600" fill="#E5484D" text-anchor="middle">TIMEOUT</text>
<text x="1330" y="567" font-size="17" fill="#9DB2D6" text-anchor="middle">watchdog fired · never “completed”</text>
<g stroke="#49BBFF" stroke-width="2.5">
<line x1="1060" y1="260" x2="1116" y2="260" marker-end="url(#aB26)"/>
<line x1="1060" y1="330" x2="1116" y2="355" marker-end="url(#aB26)"/>
<line x1="1060" y1="400" x2="1116" y2="450" marker-end="url(#aB26)"/>
<line x1="1060" y1="450" x2="1116" y2="545" marker-end="url(#aB26)"/>
</g>
<path d="M 1330 585 L 1330 720 L 115 720 L 115 384" fill="none" stroke="#9DB2D6" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#aB26)"/>
<text x="760" y="705" font-size="18" fill="#9DB2D6">terminal → back to IDLE (BenchPhases.can)</text>
<text x="60" y="800" font-size="20" fill="#F3F7FE">Timeouts and cancels are FIRST-CLASS outcomes — a run that never finished can never be mistaken for a measurement.</text>
<text x="60" y="850" font-size="19" fill="#9DB2D6">Sources: BenchRunner.kt · BenchPhases · BenchGuards.kt · BenchContract statuses · ss-07/08/09/10</text>
<rect x="40" y="885" width="1520" height="3" fill="#2A4A7A"/>
<text x="60" y="925" font-size="18" fill="#9DB2D6">Phases: IDLE → RUNNING → COMPLETED | CANCELLED | FAILED | TIMEOUT → IDLE. Guards refuse before RUNNING; nothing runs blind.</text>
</svg>
