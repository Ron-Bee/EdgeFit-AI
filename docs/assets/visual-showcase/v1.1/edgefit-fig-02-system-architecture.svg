<line x1="345" y1="268" x2="413" y2="268" stroke="#9DB2D6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aM)"/>
<line x1="413" y1="444" x2="345" y2="300" stroke="#9DB2D6" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aM)"/>
<!-- contribution -> cloud (routed under lanes, up the gap) -->
<path d="M 205 756 L 205 815 L 730 815 L 730 268 L 761 268" fill="none" stroke="#34C77B" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#aG)"/>
<text x="467" y="808" font-size="17" fill="#34C77B" text-anchor="middle">upload (consent + auth)</text>
<!-- cloud internal -->
<line x1="940" y1="316" x2="940" y2="328" stroke="#49BBFF" stroke-width="3" marker-end="url(#aB)"/>
<line x1="940" y1="426" x2="940" y2="438" stroke="#49BBFF" stroke-width="3" marker-end="url(#aB)"/>
<line x1="940" y1="550" x2="940" y2="562" stroke="#F5A623" stroke-width="3" marker-end="url(#aB)"/>
<!-- gate -> public -->
<line x1="1115" y1="619" x2="1183" y2="275" stroke="#E5484D" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#aB)"/>
<line x1="1360" y1="330" x2="1360" y2="342" stroke="#F3F7FE" stroke-width="3" marker-end="url(#aB)"/>
<!-- footer -->
<text x="60" y="860" font-size="20" fill="#F3F7FE">Contribution: IMPLEMENTED · PHYSICALLY VERIFIED (P0)  |  Publication: PROPOSED — Approval B OFF</text>
