<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1600 1000">
<style>html,body{margin:0;padding:0}text{font-family:'Segoe UI',Verdana,sans-serif}</style>
<defs><marker id="aB41" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#49BBFF"/></marker></defs>
<rect width="1600" height="1000" fill="#0A1830"/>
<text x="60" y="70" font-size="42" font-weight="700" fill="#F3F7FE">Muse Spark Agent Lifecycle</text>
<text x="60" y="106" font-size="20" fill="#9DB2D6">Model proposes · application validates · device measures · owner controls execution (FIG 41)</text>
<g font-size="19" font-weight="600" text-anchor="middle">
<rect x="620" y="140" width="360" height="70" rx="12" fill="#12294D" stroke="#49BBFF" stroke-width="2.5"/><text x="800" y="183" fill="#F3F7FE">1 · Evidence pack assembled</text>
<rect x="620" y="228" width="360" height="70" rx="12" fill="#12294D" stroke="#34C77B" stroke-width="2.5"/><text x="800" y="271" fill="#F3F7FE">2 · Owner authorizes query</text>
<rect x="620" y="316" width="360" height="70" rx="12" fill="#12294D" stroke="#8054F8" stroke-width="2.5"/><text x="800" y="359" fill="#F3F7FE">3 · Meta predicts / proposes</text>
<rect x="620" y="404" width="360" height="70" rx="12" fill="#12294D" stroke="#F5A623" stroke-width="2.5"/><text x="800" y="447" fill="#F3F7FE">4 · Host validates schema</text>
<rect x="620" y="492" width="360" height="86" rx="12" fill="#12294D" stroke="#34C77B" stroke-width="3"/><text x="800" y="525" fill="#F3F7FE">5 · OWNER DECIDES</text>
<text x="800" y="553" font-size="16" font-weight="400" fill="#9DB2D6">approve+run · modify · reject · finish</text>
<rect x="620" y="596" width="360" height="70" rx="12" fill="#12294D" stroke="#1265F5" stroke-width="2.5"/><text x="800" y="639" fill="#F3F7FE">6 · Run once, device measures</text>
<rect x="620" y="684" width="360" height="70" rx="12" fill="#12294D" stroke="#8054F8" stroke-width="2.5" stroke-dasharray="8 5"/><text x="800" y="727" fill="#F3F7FE">7 · Follow-up (optional)</text>
<rect x="620" y="772" width="360" height="70" rx="12" fill="#0E2140" stroke="#F3F7FE" stroke-width="2.5"/><text x="800" y="815" fill="#F3F7FE">8 · Terminal summary</text>
</g>
<g stroke="#49BBFF" stroke-width="2.5">
<line x1="800" y1="210" x2="800" y2="224" marker-end="url(#aB41)"/>
<line x1="800" y1="298" x2="800" y2="312" marker-end="url(#aB41)"/>
<line x1="800" y1="386" x2="800" y2="400" marker-end="url(#aB41)"/>
<line x1="800" y1="474" x2="800" y2="488" marker-end="url(#aB41)"/>
<line x1="800" y1="578" x2="800" y2="592" marker-end="url(#aB41)"/>
<line x1="800" y1="666" x2="800" y2="680" marker-end="url(#aB41)"/>
<line x1="800" y1="754" x2="800" y2="768" marker-end="url(#aB41)"/>
</g>
<!-- left notes -->
<rect x="60" y="228" width="440" height="130" rx="12" fill="#0E2140" stroke="#34C77B" stroke-width="2"/>
<text x="80" y="266" font-size="19" fill="#F3F7FE">No key, no query. Key entry is</text>
<text x="80" y="296" font-size="19" fill="#F3F7FE">explicit (ss-27); session-only</text>
<text x="80" y="326" font-size="19" fill="#9DB2D6">by default.</text>
<rect x="60" y="404" width="440" height="174" rx="12" fill="#0E2140" stroke="#F5A623" stroke-width="2"/>
<text x="80" y="442" font-size="19" fill="#F3F7FE">Fixed-schema tool validation:</text>
<text x="80" y="472" font-size="19" fill="#F3F7FE">malformed proposals are rejected</text>
<text x="80" y="502" font-size="19" fill="#F3F7FE">before the owner ever sees a</text>
<text x="80" y="532" font-size="19" fill="#9DB2D6">run button (ss-22/23).</text>
<rect x="60" y="596" width="440" height="130" rx="12" fill="#0E2140" stroke="#1265F5" stroke-width="2"/>
<text x="80" y="634" font-size="19" fill="#F3F7FE">Approval covers ONE run.</text>
<text x="80" y="664" font-size="19" fill="#F3F7FE">Every further run needs a new</text>
<text x="80" y="694" font-size="19" fill="#9DB2D6">explicit approval (ss-18/24).</text>
<!-- right notes -->
<rect x="1040" y="140" width="500" height="150" rx="12" fill="#0E2140" stroke="#8054F8" stroke-width="2"/>
<text x="1060" y="178" font-size="19" fill="#F3F7FE">Session budget: five attempts —</text>
<text x="1060" y="208" font-size="19" fill="#F3F7FE">the agent must finish, abstain,</text>
<text x="1060" y="238" font-size="19" fill="#F3F7FE">or report failure within its</text>
<text x="1060" y="268" font-size="19" fill="#9DB2D6">allowance (ch. 7).</text>
<rect x="1040" y="316" width="500" height="150" rx="12" fill="#0E2140" stroke="#E5484D" stroke-width="2"/>
<text x="1060" y="354" font-size="19" fill="#F3F7FE">Abstention + failure are valid</text>
<text x="1060" y="384" font-size="19" fill="#F3F7FE">endings: unsafe or unsupported</text>
<text x="1060" y="414" font-size="19" fill="#F3F7FE">requests end WITHOUT a run —</text>
<text x="1060" y="444" font-size="19" fill="#9DB2D6">recorded, not hidden.</text>
<rect x="1040" y="492" width="500" height="150" rx="12" fill="#0E2140" stroke="#49BBFF" stroke-width="2"/>
<text x="1060" y="530" font-size="19" fill="#F3F7FE">Predicted-vs-measured review</text>
<text x="1060" y="560" font-size="19" fill="#F3F7FE">closes the loop: exp-4 showed</text>
<text x="1060" y="590" font-size="19" fill="#F3F7FE">gen +1.36% / prefill +14.8% —</text>
<text x="1060" y="620" font-size="19" fill="#9DB2D6">kept distinct (ss-14, ch. 11).</text>
<g stroke="#9DB2D6" stroke-width="2" stroke-dasharray="6 4">
<line x1="616" y1="270" x2="504" y2="290" marker-end="url(#aB41)"/>
<line x1="616" y1="450" x2="504" y2="490" marker-end="url(#aB41)"/>
<line x1="616" y1="640" x2="504" y2="660" marker-end="url(#aB41)"/>
<line x1="984" y1="200" x2="1036" y2="215" marker-end="url(#aB41)"/>
<line x1="984" y1="360" x2="1036" y2="390" marker-end="url(#aB41)"/>
<line x1="984" y1="550" x2="1036" y2="567" marker-end="url(#aB41)"/>
</g>
<text x="60" y="900" font-size="19" fill="#9DB2D6">Sources: walkthrough ch. 7 (agent lifecycle) · ss-13…ss-24 verified captures · MetaKeyVault session/Keystore handling · NFR-SEC-01</text>
<rect x="40" y="920" width="1520" height="3" fill="#2A4A7A"/>
<text x="60" y="955" font-size="18" fill="#F3F7FE">The agent never touches the run button — the owner does, once per run, after host validation.</text>
</svg>
