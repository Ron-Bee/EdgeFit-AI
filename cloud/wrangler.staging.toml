# EF-GLOBAL-01 staging Worker configuration — STAGING ONLY.
#
# Applied under owner-gated G2-B2 (FREE-02, 2026-10-31):
#   Worker: edgefit-evidence-staging (env staging deploys as
#     edgefit-evidence-staging-staging; workers_dev = false, so
#     there is deliberately NO public URL)
#   D1: edgefit-evidence-staging
#     (2ccce000-c70c-4c5a-9267-d330dedc22aa)
#   Cron Trigger: */10 * * * * (scheduled() only; no HTTP surface)
#   Secrets set ONLY via `wrangler secret put` (INSTALL_SALT is
#     set; it never appears in this file or in git).
# The database_id below is a non-secret staging resource locator,
# recorded here by owner decision (FREE-04 E) so staging deploys
# reproduce from a clean checkout. Production does not exist.
# Do not run remote commands against this file without the
# milestone authorization that names them.
#
# Local tests do NOT read this file: they inject adapters directly
# into cloud/worker.js workerFetch.
#
# Wrangler itself is deliberately NOT installed (no dependency or
# lockfile changes): remote commands use a pinned npx wrangler@x
# version recorded in the milestone report.

name = "edgefit-evidence-staging"
# Entry point, relative to this file (cloud/).
main = "worker.js"
# Workers runtime behavior is versioned by this date; keep pinned so
# staging and review run the same semantics. nodejs_compat provides
# node:crypto, which the Worker uses for synchronous SHA-256 (see
# cloud/worker.js): without it the Worker fails to start.
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]

# No production environment exists in this file. Staging only.
[env.staging]
# Deliberately nonpublic: no workers.dev URL unless a later
# milestone explicitly authorizes and protects HTTP exposure
# (H10). The Cron Trigger below is the only entry point.
workers_dev = false
# No custom domain, no route: nothing public by default. The Cron
# Trigger below is NOT a public route: it invokes scheduled()
# server-side only, on UTC cadence, with no HTTP surface.

[env.staging.triggers]
# Owner-approved initial cadence: every 10 minutes, subject to
# measured Free-tier performance. One trigger of the 5/account
# Free allowance. Each tick processes at most 10 rows
# (SCHEDULED_MAX_ROWS, worker.js); empty ticks cost one snapshot
# SELECT. Best-effort timing per Cloudflare Cron semantics:
# clients poll for promotion and never depend on tick latency.
crons = ["*/10 * * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "edgefit-evidence-staging"
# Real staging id, recorded by owner decision (FREE-04 E).
# Non-secret resource locator; staging-only; production DNE.
database_id = "2ccce000-c70c-4c5a-9267-d330dedc22aa"
# Migrations directory, relative to this file.
migrations_dir = "migrations"

# Secrets (set ONLY via `wrangler secret put` under G2-B2; never in
# this file, never in git):
#   INSTALL_SALT — random per-deployment salt for install identities.
# No Meta service key, no install tokens, no API keys live here.
